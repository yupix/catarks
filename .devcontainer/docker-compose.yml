version: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../:/workspace:cached

    command: sleep infinity

    networks:
      - internal_network
      - external_network

  db:
    restart: unless-stopped
    image: postgres:15-alpine
    networks:
      - internal_network
    environment:
      POSTGRES_USER: example-catarks-user
      POSTGRES_PASSWORD: example-catarks-pass
      POSTGRES_DB: catarks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 5s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    networks:
      - internal_network
    volumes:
      - redis-data:/data
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      retries: 20

  meilisearch:
    container_name: meilisearch
    image: getmeili/meilisearch:v1.2
    networks:
      - internal_network
    volumes:
      - meili-data:/data.ms
    environment:
      MEILI_MASTER_KEY: "catarks-meili"

volumes:
  postgres-data:
  redis-data:
  meili-data:

networks:
  internal_network:
    internal: true
  external_network: